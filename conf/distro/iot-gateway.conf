# Poky for the IoT gateway: Podman host, systemd, and the features that
# IOT_GATEWAY_PROFILE needs. Select with "bitbake-config-build
# enable-fragment distro/iot-gateway" or DISTRO = "iot-gateway".

require conf/distro/poky.conf
require conf/distro/include/meta-virt-host.conf
require conf/distro/include/iot-gateway.inc

DISTRO = "iot-gateway"
DISTRO_NAME = "IoT Gateway (Poky based)"

DISTRO_FEATURES:append = " usrmerge"
