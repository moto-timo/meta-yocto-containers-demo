# IoT Edge Gateway - Mosquitto MQTT Broker Configuration
#
# Listeners:
#   1883 - Standard MQTT (for container-to-container communication)
#   9001 - MQTT over WebSocket (for browser-based dashboard)

# --- MQTT listener ---
listener 1883 0.0.0.0
protocol mqtt

# --- WebSocket listener ---
listener 9001 0.0.0.0
protocol websockets

# --- Authentication ---
# Demo mode: anonymous access enabled.
# For production, configure password_file or an auth plugin.
allow_anonymous true

# --- Logging ---
log_type error
log_type warning
log_type notice
log_dest stderr

# --- Persistence ---
# Disabled for a stateless container; enable for durable subscriptions.
persistence false

# --- Limits ---
max_connections -1
max_queued_messages 1000
