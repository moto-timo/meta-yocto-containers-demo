# mqtt-auth: HTTPS only, behind a login; /mqtt proxies to the local broker,
# which checks the MQTT password.

# Browsers check for a new page on each load; the MQTT login is not stored.
map $uri $cache_control {
    /mqtt.json  no-store;
    default     no-cache;
}

server {
    listen       8443 ssl;
    server_name  _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.3;
    server_tokens       off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    auth_basic           "IoT Gateway";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location = /mqtt.json {
        alias /etc/nginx/dashboard/mqtt.json;
    }

    # Safari does not send the login with the WebSocket: /mqtt has none,
    # the page sends the MQTT password from mqtt.json instead.
    location /mqtt {
        auth_basic         off;
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
