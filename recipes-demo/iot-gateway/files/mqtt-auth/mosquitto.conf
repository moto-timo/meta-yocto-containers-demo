# mqtt-auth: logins and ACLs (mosquitto.acl); other hosts only over TLS.
per_listener_settings true

# Sensor processor, this host only
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Dashboard, via the web server's /mqtt proxy. Browsers do not all send
# the page's login with a WebSocket, so the broker checks the password.
listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Other hosts: TLS and a password.
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/tls/cert.pem
keyfile /mosquitto/tls/key.pem
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

log_type error
log_type warning
log_type notice
log_dest stderr
persistence false
max_connections -1
max_queued_messages 1000
